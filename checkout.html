<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout — PopDrop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">POP<span>DROP</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
    </div>
    <div class="nav-actions">
      <a href="account.html" class="nav-account">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span id="account-label">Sign In</span>
      </a>
      <a href="cart.html" class="nav-cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Cart
        <span class="cart-badge" id="cart-badge">0</span>
      </a>
    </div>
  </nav>

  <main id="main-content"></main>

  <footer class="footer" id="site-footer">
    <div class="footer-grid">
      <div>
        <div class="footer-logo">POP<span>DROP</span></div>
        <p class="footer-tagline">Real ingredients. Real fizz. No compromises.</p>
      </div>
      <div class="footer-col">
        <p class="footer-col-title">Shop</p>
        <a href="products.html">All Flavors</a>
        <a href="products.html">Variety Packs</a>
      </div>
      <div class="footer-col">
        <p class="footer-col-title">Company</p>
        <a href="#">Our Story</a>
        <a href="#">Sustainability</a>
      </div>
      <div class="footer-col">
        <p class="footer-col-title">Support</p>
        <a href="#">FAQ</a>
        <a href="#">Contact</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© 2026 PopDrop Beverage Co. All rights reserved.</span>
      <span>Made with fizz and love.</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const main = document.getElementById("main-content");
    let step = "shipping";
    const savedCustomer = PopDropAccount.customer();
    let shippingData = savedCustomer ? { ...savedCustomer.profile } : {};
    let orderNum = "PD-" + (Math.floor(Math.random() * 90000) + 10000);

    function escapeHTML(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
    }

    function getOrderSummaryHTML() {
      const items = Cart.get();
      const { subtotal, promotionApplied, discount, shipping, vat, total } = getOrderPricing(items);

      const miniItems = items.map(item => {
        const p = PRODUCTS.find(x => x.id === item.id);
        if (!p) return "";
        return `
          <div class="mini-item">
            <div class="mini-thumb" style="background:${p.highlight}">${makeProductImage(p, 44)}</div>
            <div class="mini-info">
              <p class="mini-name">${p.name}</p>
              <p class="mini-qty">×${item.qty}</p>
            </div>
            <p class="mini-price">${formatPeso(p.price * item.qty)}</p>
          </div>`;
      }).join("");

      return `
        <div class="order-summary-mini">
          <h2>ORDER SUMMARY</h2>
          <div class="mini-items">${miniItems}</div>
          <div class="summary-row">
            <span class="label">Subtotal</span>
            <span class="val">${formatPeso(subtotal)}</span>
          </div>
          ${promotionApplied ? `
          <div class="summary-row summary-discount">
            <span class="label">Mix Any 6 discount (10%)</span>
            <span class="val">−${formatPeso(discount)}</span>
          </div>` : ""}
          <div class="summary-row">
            <span class="label">Shipping</span>
            <span class="val">${shipping === 0 ? '<span style="color:#22c55e">Free</span>' : formatPeso(shipping)}</span>
          </div>
          <div class="summary-row">
            <span class="label">VAT included (12%)</span>
            <span class="val">${formatPeso(vat)}</span>
          </div>
          <hr class="summary-divider" />
          <div class="summary-row summary-total">
            <span class="label">Total</span>
            <span class="val">${formatPeso(total)}</span>
          </div>
        </div>`;
    }

    function getStepsHTML() {
      const isPayment = step === "payment";
      return `
        <div class="steps">
          <div class="step">
            <div class="step-num ${isPayment ? "done" : "active"}">${isPayment ? "✓" : "1"}</div>
            <span class="step-label">Shipping</span>
          </div>
          <span class="step-divider">—</span>
          <div class="step">
            <div class="step-num ${isPayment ? "active" : ""}">${isPayment ? "2" : "2"}</div>
            <span class="step-label">Payment</span>
          </div>
        </div>`;
    }

    function renderShipping() {
      main.innerHTML = `
        <div class="checkout-page">
          <h1>CHECKOUT</h1>
          ${getStepsHTML()}
          <div class="checkout-layout">
            <form id="shipping-form">
              <h2 class="form-title">Shipping Information</h2>
              <div class="form-grid">
                <div class="form-group">
                  <label class="form-label">First Name</label>
                  <input class="form-input" name="firstName" placeholder="Juan" required value="${escapeHTML(shippingData.firstName)}" />
                </div>
                <div class="form-group">
                  <label class="form-label">Last Name</label>
                  <input class="form-input" name="lastName" placeholder="Dela Cruz" required value="${escapeHTML(shippingData.lastName)}" />
                </div>
                <div class="form-group full">
                  <label class="form-label">Email</label>
                  <input class="form-input" name="email" type="email" placeholder="juan@email.com" required value="${escapeHTML(shippingData.email)}" />
                </div>
                <div class="form-group full">
                  <label class="form-label">Mobile Number</label>
                  <input class="form-input" name="phone" type="tel" placeholder="+63 917 123 4567" value="${escapeHTML(shippingData.phone)}" />
                </div>
                <div class="form-group full">
                  <label class="form-label">House / Unit / Street</label>
                  <input class="form-input" name="address" placeholder="Unit 5, 123 Mabini Street" required value="${escapeHTML(shippingData.address)}" />
                </div>
                <div class="form-group">
                  <label class="form-label">Barangay</label>
                  <input class="form-input" name="barangay" placeholder="Barangay Lahug" required value="${escapeHTML(shippingData.barangay)}" />
                </div>
                <div class="form-group">
                  <label class="form-label">City / Municipality</label>
                  <input class="form-input" name="city" placeholder="Cebu City" required value="${escapeHTML(shippingData.city)}" />
                </div>
                <div class="form-group">
                  <label class="form-label">Province</label>
                  <input class="form-input" name="province" placeholder="Cebu" required value="${escapeHTML(shippingData.province || shippingData.state)}" />
                </div>
                <div class="form-group">
                  <label class="form-label">Postal Code</label>
                  <input class="form-input" name="postalCode" inputmode="numeric" maxlength="4" placeholder="6000" required value="${escapeHTML(shippingData.postalCode || shippingData.zip)}" />
                </div>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn-primary">Continue to Payment →</button>
              </div>
            </form>
            ${getOrderSummaryHTML()}
          </div>
        </div>`;

      document.getElementById("shipping-form").addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        shippingData = Object.fromEntries(fd.entries());
        if (savedCustomer) PopDropAccount.updateProfile(shippingData);
        step = "payment";
        renderPayment();
      });
    }

    function renderPayment() {
      const { total } = getOrderPricing(Cart.get());

      main.innerHTML = `
        <div class="checkout-page">
          <h1>CHECKOUT</h1>
          ${getStepsHTML()}
          <div class="checkout-layout">
            <form id="payment-form">
              <h2 class="form-title">Payment Details</h2>
              <div class="form-grid">
                <div class="form-group full">
                  <label class="form-label">Card Number</label>
                  <input class="form-input mono" name="cardNumber" placeholder="4242 4242 4242 4242" maxlength="19" required />
                </div>
                <div class="form-group full">
                  <label class="form-label">Name on Card</label>
                  <input class="form-input" name="cardName" placeholder="${escapeHTML(shippingData.firstName || "Alex")} ${escapeHTML(shippingData.lastName || "Rivera")}" required />
                </div>
                <div class="form-group">
                  <label class="form-label">Expiry</label>
                  <input class="form-input mono" name="expiry" placeholder="MM / YY" maxlength="7" required />
                </div>
                <div class="form-group">
                  <label class="form-label">CVV</label>
                  <input class="form-input mono" name="cvv" type="password" placeholder="•••" maxlength="4" required />
                </div>
              </div>
              <div class="form-actions">
                <button type="button" class="btn-back" id="back-btn">← Back</button>
                <button type="submit" class="btn-primary">Place Order — ${formatPeso(total)}</button>
              </div>
            </form>
            ${getOrderSummaryHTML()}
          </div>
        </div>`;

      document.getElementById("back-btn").addEventListener("click", () => {
        step = "shipping";
        renderShipping();
      });

      document.getElementById("payment-form").addEventListener("submit", e => {
        e.preventDefault();
        const items = Cart.get();
        const pricing = getOrderPricing(items);
        PopDropAccount.recordOrder({
          number: orderNum,
          subtotal: pricing.subtotal,
          discount: pricing.discount,
          shippingFee: pricing.shipping,
          total: pricing.total,
          email: shippingData.email,
          shipping: shippingData,
          items
        });
        Cart.clear();
        renderConfirmation();
      });
    }

    function renderConfirmation() {
      document.getElementById("site-footer").style.marginTop = "0";
      main.innerHTML = `
        <div class="confirmation">
          <div class="conf-icon">🎉</div>
          <h1>ORDER CONFIRMED!</h1>
          <p>Your PopDrop is on its way, ${escapeHTML(shippingData.firstName || "friend")}.</p>
          <p>Confirmation sent to <strong>${escapeHTML(shippingData.email || "your email")}</strong>.<br>Estimated delivery: 3–5 business days.</p>
          <div class="conf-box">
            <p class="conf-order-num">Order ${orderNum}</p>
            <p class="conf-address">Shipping to: ${escapeHTML(shippingData.address)}, ${escapeHTML(shippingData.barangay)}, ${escapeHTML(shippingData.city)}, ${escapeHTML(shippingData.province)} ${escapeHTML(shippingData.postalCode)}</p>
          </div>
          <a href="index.html" class="btn-primary">Back to Home</a>
        </div>`;
    }

    // Init
    const items = Cart.get();
    if (items.length === 0) {
      main.innerHTML = `
        <div style="text-align:center;padding:120px 24px">
          <h2 style="font-family:'Archivo Black',sans-serif;font-size:2rem;margin-bottom:12px">Nothing to check out</h2>
          <a href="products.html" style="color:var(--orange);font-weight:800">Go shop some flavors →</a>
        </div>`;
    } else {
      renderShipping();
    }
  </script>
</body>
</html>
