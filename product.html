<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — PopDrop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">POP<span>DROP</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
    </div>
    <div class="nav-actions">
      <a href="account.html" class="nav-account">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span id="account-label">Sign In</span>
      </a>
      <a href="cart.html" class="nav-cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Cart
        <span class="cart-badge" id="cart-badge">0</span>
      </a>
    </div>
  </nav>

  <main id="main-content">
    <!-- Rendered by JS -->
  </main>

  <footer class="footer">
    <div class="footer-grid">
      <div>
        <div class="footer-logo">POP<span>DROP</span></div>
        <p class="footer-tagline">Real ingredients. Real fizz. No compromises.</p>
      </div>
      <div class="footer-col">
        <p class="footer-col-title">Shop</p>
        <a href="products.html">All Flavors</a>
        <a href="products.html">Variety Packs</a>
      </div>
      <div class="footer-col">
        <p class="footer-col-title">Company</p>
        <a href="#">Our Story</a>
        <a href="#">Sustainability</a>
      </div>
      <div class="footer-col">
        <p class="footer-col-title">Support</p>
        <a href="#">FAQ</a>
        <a href="#">Contact</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© 2026 PopDrop Beverage Co. All rights reserved.</span>
      <span>Made with fizz and love.</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const id = parseInt(params.get("id"));
    const product = PRODUCTS.find(p => p.id === id);
    const main = document.getElementById("main-content");

    if (!product) {
      main.innerHTML = `
        <div style="text-align:center;padding:120px 24px">
          <p style="font-size:4rem;margin-bottom:16px">🥤</p>
          <h2 style="font-family:'Archivo Black',sans-serif;font-size:2rem;margin-bottom:12px">Flavor not found</h2>
          <a href="products.html" style="color:var(--orange);font-weight:800;">Back to all flavors</a>
        </div>`;
    } else {
      document.title = `${product.name} — PopDrop`;

      const related = PRODUCTS.filter(p => p.id !== product.id).slice(0, 3);
      let qty = 1;

      main.innerHTML = `
        <nav class="detail-breadcrumb">
          <a href="index.html">Home</a> /
          <a href="products.html">Shop</a> /
          <span>${product.name}</span>
        </nav>

        <div class="detail-grid">
          <div class="detail-can-box" style="background:${product.highlight}">
            <div class="detail-deco1" style="background:${product.canColor}"></div>
            <div class="detail-deco2" style="background:${product.accentColor}"></div>
            ${makeProductImage(product, 280)}
            <span class="detail-volume-pill" style="background:${product.canColor}">${product.volume}</span>
          </div>

          <div class="detail-info">
            <p class="detail-eyebrow">${product.flavor}</p>
            <h1 class="detail-name">${product.name}</h1>
            <p class="detail-tagline" style="color:${product.canColor}">"${product.tagline}"</p>
            <p class="detail-desc">${product.description}</p>

            <div class="detail-stats">
              <div>
                <p class="detail-stat-label">Calories</p>
                <p class="detail-stat-val">${product.calories}</p>
              </div>
              <div>
                <p class="detail-stat-label">Volume</p>
                <p class="detail-stat-val">${product.volume}</p>
              </div>
              <div>
                <p class="detail-stat-label">Price</p>
                <p class="detail-stat-val" style="color:var(--orange)">${formatPeso(product.price)}</p>
              </div>
            </div>

            <div class="qty-row">
              <span style="font-size:.875rem;font-weight:700;color:#888">Quantity</span>
              <div class="qty-control">
                <button class="qty-btn" id="qty-minus">−</button>
                <span class="qty-val" id="qty-display">1</span>
                <button class="qty-btn" id="qty-plus">+</button>
              </div>
              <span class="qty-total" id="qty-total">${formatPeso(product.price)} total</span>
            </div>

            <div class="detail-actions">
              <button class="btn-primary" id="add-btn">Add to Cart</button>
              <button class="btn-purple" id="buy-btn">Buy Now →</button>
            </div>
          </div>
        </div>

        <section class="ingredients-section">
          <h2>INGREDIENTS</h2>
          <div class="ingredients-list">
            ${product.ingredients.map(ing => `
              <span class="ing-tag" style="border-color:${product.canColor};color:${product.canColor};background:${product.highlight}">${ing}</span>
            `).join("")}
          </div>
        </section>

        <section class="related-section">
          <h2>MORE FLAVORS</h2>
          <div class="related-grid">
            ${related.map(p => `
              <a href="product.html?id=${p.id}" class="related-card">
                <div class="can-wrap">${makeProductImage(p, 80)}</div>
                <div class="related-info">
                  <p class="name">${p.name}</p>
                  <p class="sub">${p.flavor}</p>
                  <p class="price">${formatPeso(p.price)}</p>
                </div>
              </a>`).join("")}
          </div>
        </section>
      `;

      // Qty controls
      document.getElementById("qty-minus").addEventListener("click", () => {
        if (qty > 1) qty--;
        document.getElementById("qty-display").textContent = qty;
        document.getElementById("qty-total").textContent = `${formatPeso(product.price * qty)} total`;
      });
      document.getElementById("qty-plus").addEventListener("click", () => {
        qty++;
        document.getElementById("qty-display").textContent = qty;
        document.getElementById("qty-total").textContent = `${formatPeso(product.price * qty)} total`;
      });

      // Add to cart
      document.getElementById("add-btn").addEventListener("click", function() {
        Cart.add(product.id, qty);
        this.textContent = "Added ✓";
        this.classList.add("btn-success");
        setTimeout(() => {
          this.textContent = "Add to Cart";
          this.classList.remove("btn-success");
        }, 2000);
      });

      // Buy now
      document.getElementById("buy-btn").addEventListener("click", () => {
        Cart.add(product.id, qty);
        window.location.href = "cart.html";
      });
    }
  </script>
</body>
</html>
