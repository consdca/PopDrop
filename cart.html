<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart — PopDrop</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="nav">
    <a href="index.html" class="nav-logo">POP<span>DROP</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="products.html">Shop</a>
    </div>
    <div class="nav-actions">
      <a href="account.html" class="nav-account">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span id="account-label">Sign In</span>
      </a>
      <a href="cart.html" class="nav-cart">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>
        Cart
        <span class="cart-badge" id="cart-badge">0</span>
      </a>
    </div>
  </nav>

  <main>
    <div class="cart-page" id="cart-page"></div>
  </main>

  <footer class="footer">
    <div class="footer-grid">
      <div>
        <div class="footer-logo">POP<span>DROP</span></div>
        <p class="footer-tagline">Real ingredients. Real fizz. No compromises.</p>
      </div>
      <div class="footer-col">
        <p class="footer-col-title">Shop</p>
        <a href="products.html">All Flavors</a>
        <a href="products.html">Variety Packs</a>
      </div>
      <div class="footer-col">
        <p class="footer-col-title">Company</p>
        <a href="#">Our Story</a>
        <a href="#">Sustainability</a>
      </div>
      <div class="footer-col">
        <p class="footer-col-title">Support</p>
        <a href="#">FAQ</a>
        <a href="#">Contact</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>© 2026 PopDrop Beverage Co. All rights reserved.</span>
      <span>Made with fizz and love.</span>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function renderCart() {
      const page = document.getElementById("cart-page");
      const items = Cart.get();

      if (items.length === 0) {
        page.innerHTML = `
          <div class="cart-empty">
            <div class="icon">🥤</div>
            <h2>YOUR CART IS EMPTY</h2>
            <p>Time to drop some flavor in here.</p>
            <a href="products.html" class="btn-primary">Shop All Flavors</a>
          </div>`;
        return;
      }

      const { subtotal, totalItems, promotionApplied, discount, shipping, vat, total } = getOrderPricing(items);

      const itemsHTML = items.map(item => {
        const p = PRODUCTS.find(x => x.id === item.id);
        if (!p) return "";
        return `
          <div class="cart-item" data-id="${p.id}">
            <div class="cart-item-thumb" style="background:${p.highlight}">
              ${makeProductImage(p, 80)}
            </div>
            <div class="cart-item-info">
              <a href="product.html?id=${p.id}" class="cart-item-name">${p.name}</a>
              <p class="cart-item-meta">${p.flavor} · ${p.volume}</p>
              <p class="cart-item-price">${formatPeso(p.price)} each</p>
            </div>
            <div class="qty-control small">
              <button class="qty-btn" onclick="changeQty(${p.id}, ${item.qty - 1})">−</button>
              <span class="qty-val">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${p.id}, ${item.qty + 1})">+</button>
            </div>
            <div class="cart-item-total">
              <p class="amount">${formatPeso(p.price * item.qty)}</p>
              <button class="remove-btn" onclick="removeItem(${p.id})">Remove</button>
            </div>
          </div>`;
      }).join("");

      const promotionNote = promotionApplied
        ? `<p class="free-shipping-note">Mix 6 promotion applied: 10% off + free shipping!</p>`
        : `<p class="free-shipping-note">Add ${6 - totalItems} more ${6 - totalItems === 1 ? "can" : "cans"} for 10% off + free shipping!</p>`;

      page.innerHTML = `
        <h1>YOUR CART (${totalItems})</h1>
        <div class="cart-layout">
          <div>
            <div class="cart-items">${itemsHTML}</div>
            <a href="products.html" class="cart-continue">← Continue Shopping</a>
          </div>
          <div class="cart-summary">
            <h2>ORDER SUMMARY</h2>
            <div class="summary-row">
              <span class="label">Subtotal (${totalItems} items)</span>
              <span class="val">${formatPeso(subtotal)}</span>
            </div>
            ${promotionApplied ? `
            <div class="summary-row summary-discount">
              <span class="label">Mix Any 6 discount (10%)</span>
              <span class="val">−${formatPeso(discount)}</span>
            </div>` : ""}
            <div class="summary-row">
              <span class="label">Shipping</span>
              <span class="val">${shipping === 0 ? '<span style="color:#22c55e">Free</span>' : formatPeso(shipping)}</span>
            </div>
            <div class="summary-row">
              <span class="label">VAT included (12%)</span>
              <span class="val">${formatPeso(vat)}</span>
            </div>
            ${promotionNote}
            <hr class="summary-divider" />
            <div class="summary-row summary-total">
              <span class="label">Total</span>
              <span class="val">${formatPeso(total)}</span>
            </div>
            <a href="checkout.html" class="btn-primary" style="display:block;text-align:center;margin-top:24px">
              Proceed to Checkout →
            </a>
            <p class="secure-note">🔒 Secure checkout powered by Stripe</p>
          </div>
        </div>`;
    }

    function changeQty(id, qty) {
      Cart.setQty(id, qty);
      renderCart();
    }

    function removeItem(id) {
      Cart.remove(id);
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
